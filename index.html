<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotstar</title>
    <link rel="stylesheet" href="./assets/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<body>

<img src="./assets/images/hot logo.png" class="hotstar-logo" alt="Disney hotstar logo"/>

            <span><i class="fa-solid fa-magnifying-glass"></i></span>
            <div class="nav">
                <span class="label"><a href="#">Search</a></span>
            </div>
                </li>
        <li class="panel-item">
            <span><i class="fa-solid fa-house"></i></span>
            <div class="nav">
                <span class="label"><a href="#">Home</a></span>
            </div>
        </li>
        <li class="panel-item">
            <span><i class="fa-solid fa-tv"></i></span>
            <div class="nav">
            <span class="label"><a href="#">Tv</a></span>
            </div>
        </li>
        <li class="panel-item">
            <span><i class="fa-solid fa-film"></i></span>
            <div class="nav">
                <span class="label"><a href="#">Movies</a></span>
            </div>
        </li>
        <li class="panel-item">
            <span><i class="fa-solid fa-film"></i></span>
            <div class="nav">
                <span class="label"><a href="#">Sports</a></span>
            </div>
        </li>
        <li class="panel-item">
            <span><i class="fa-solid fa-list"></i></span>
            <div class="nav">
                <span class="label"><a href="#">categories</a></span>
            </div>
        </li>
    </ul>
</div>  
</aside>
<!--LEFT PANNEL END-->
<section class="main-sec">
    <div class="ad-container">
        <div class="ad-video">
         <img src="./assets/images/amazon.jpg" alt="" class="amazon-ad" />
        </div>
        <div class="left-content">
            <div class="ad-content">
                <div class="ad">
                    <img src="./assets/images/120X120amazon.jpg" alt="" class="ad-image"/>
                </div>
                <div class="ad-box">
                    <span>Ad</span>
                    <p class="ad-title">Amazon deals!</p>
                </div>
                <div class="ad-des">
                    <p>Great amazon shopping deals!</p>
                </div>
            </div>
            <div class="ad-btn">
                <button class="sub-btn">Shop Now</button>
            </div>
        </div>  
    </div>
<!--video-->
<div class="video-container">
    <div class="video">
    <video src="./assets/images/video/bb8 video.mp4" autoplay muted loop ></video>
    </div>
    <div class="video-content">
        <div class="show-logo">
        </div>
        <!--Add carouselssss-->
    </div>
</div>
</section>
    <!--horizontal carousel-->
    <div class="carousel-container">
        <p class="pshow">Popular shows</p>
        <div class="carousel" id="carousel"></div>
        
        <button id="prev" class="btn-left"><</button>
          <button id="next" class="btn-right">></button>
      </div>

      </footer>
